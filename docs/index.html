<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bee Mosaic — Legal</title>
<meta name="description" content="Legal documents for the mobile game Bee Mosaic, published by Ragendom (Ronald Farkas).">
<style>
  :root{--bg:#ffffff;--fg:#1a1a1a;--muted:#5c5c5c;--line:#e3e3e3;--accent:#2a5db0;--card:#f7f7f8}
  @media (prefers-color-scheme:dark){
    :root{--bg:#14161a;--fg:#e8e8ea;--muted:#a0a4ab;--line:#2a2e35;--accent:#7aa7f0;--card:#1c1f25}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .wrap{max-width:640px;margin:0 auto;padding:56px 20px 80px}
  h1{font-size:2rem;margin:0 0 6px}
  .sub{color:var(--muted);margin:0 0 36px}
  a.card{display:block;border:1px solid var(--line);border-radius:10px;padding:18px 20px;
         margin:0 0 14px;text-decoration:none;background:var(--card);color:var(--fg)}
  a.card:hover{border-color:var(--accent)}
  a.card strong{display:block;color:var(--accent);font-size:1.08rem;margin-bottom:3px}
  a.card span{color:var(--muted);font-size:.92rem}
  footer{margin-top:44px;padding-top:20px;border-top:1px solid var(--line);color:var(--muted);font-size:.88rem}
  footer a{color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Bee Mosaic</h1>
  <p class="sub">Legal documents &middot; published by Ragendom</p>

  <a class="card" href="./privacy/">
    <strong>Privacy Policy</strong>
    <span>What data is collected, by whom, why, and how to delete it.</span>
  </a>

  <a class="card" href="./terms/">
    <strong>Terms of Use</strong>
    <span>Licence, virtual items, purchases and refunds, liability.</span>
  </a>

  <footer>
    <p>Support and privacy enquiries: <a href="mailto:ragendom@gmail.com">ragendom@gmail.com</a></p>
    <p>&copy; 2026 Ronald Farkas (Ragendom), Hungary.</p>
  </footer>
</div>
</body>
</html>
